# Ideal Management — a standalone static site with two serverless functions.
#
# This file sits at the repository root, so every path below is relative to it
# and the Netlify project needs no base directory. Nothing here is built: the
# HTML, CSS and JS ship as written.
#
# `publish = "public"` rather than "." on purpose — it keeps the function
# source, package.json and README out of the deployed site.
#
# The functions declare their own routes in code (`export const config.path`),
# so /api/ideal-chat and /api/ideal-health need no redirects.

[build]
  publish = "public"
  command = ""

[build.environment]
  # Netlify's secret scanner looks for the *values* of environment variables in
  # the build output. OPENROUTER_MODEL holds a public model id, and that same id
  # is the fallback default in the functions — so the scanner finds it and fails
  # the build over a string that was never a secret.
  #
  # Omit that one variable by name rather than reaching for
  # SECRETS_SCAN_ENABLED = "false". The scanner is the thing that would catch
  # OPENROUTER_API_KEY if it were ever committed by accident, and switching it
  # off wholesale to silence a false positive trades a real safeguard for
  # convenience. Anything added here must be genuinely non-secret.
  SECRETS_SCAN_OMIT_KEYS = "OPENROUTER_MODEL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Ideal AI answers from the site's own pages. Shipping the deployed HTML with
  # the functions lets it read them off disk — no network call, no cold-start
  # latency, and it cannot disagree with what was actually deployed.
  included_files = ["public/**/*.html"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fingerprint-free asset names, so cache for an hour rather than a year: an
# edit to the CSS should reach visitors the same day, not next month.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
